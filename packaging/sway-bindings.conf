# Notification keys (decision D3). Installed at cutover (M8) as
# ~/.config/sway/config.d/60-bindings-notifications.conf and applied live
# with `swaymsg bindsym ...`, without a sway reload.
bindsym $mod+n exec quickshell ipc -p ~/.local/share/bar call notify dismiss
bindsym $mod+Shift+n exec quickshell ipc -p ~/.local/share/bar call notify dismissAll
bindsym $mod+Ctrl+n exec quickshell ipc -p ~/.local/share/bar call notify restore
bindsym $mod+Shift+d exec quickshell ipc -p ~/.local/share/bar call notify toggleDnd
