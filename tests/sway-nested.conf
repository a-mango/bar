# Minimal sway config for the nested test desktop. Only tests/nested.sh
# starts sway with it (headless backend, private D-Bus, overridden SWAYSOCK).
# It has no bar {} block and includes nothing from the user's config.

xwayland disable

# Same logical size as eDP-1: 1920x1200 at scale 2.
output HEADLESS-1 mode --custom 3840x2400 scale 2

default_border none
focus_follows_mouse no

# Modes for matrix case B3. The second one stands in for the long
# "present:" cheat-sheet mode of the live config (fictional text).
mode "resize" {
    bindsym Escape mode "default"
}
mode "present: n next · p previous · b blank · z zoom · Escape leave the fictional cheat sheet" {
    bindsym Escape mode "default"
}
# Matrix case NW: a name so long that a note would get less than 600 px,
# so the mode label has to elide while the note shows.
mode "present: n next · p previous · b blank · z zoom · f freeze · r reload · s swap screens · t timer · h hide notes · Escape leave the fictional cheat sheet that runs on past the clock" {
    bindsym Escape mode "default"
}

# Writes .test/env, then starts the client for the chosen variant
# (quickshell -p $BAR_REPO, waybar for `make reference`, or nothing).
exec exec "$BAR_REPO/tests/nested.sh" _inside
